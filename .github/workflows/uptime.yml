name: Uptime

# External heartbeat for the public instance, from GitHub's infra (so a
# dead VPS is actually noticed). A failed run emails the user who last
# touched this file's cron line — that is the alert.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe the public instance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API healthz + console
        run: |
          probe() {
            # Two attempts 20s apart: a transient blip must not page anyone.
            for attempt in 1 2; do
              code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "$1") || code=000
              [ "$code" = "200" ] && { echo "ok   $1"; return 0; }
              echo "warn $1 answered $code (attempt $attempt)"
              sleep 20
            done
            echo "FAIL $1"
            return 1
          }
          probe https://api.cachetzec.com/healthz
          probe https://cachetzec.com
