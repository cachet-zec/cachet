name: Uptime

# Backup heartbeat for the public instance, from GitHub's infra. GitHub
# runs schedules on a best-effort basis: since September this ran 3 to 9
# times a day, not every five minutes, so it can miss an outage for hours.
# The main heartbeat is UptimeRobot, which probes the same three URLs
# every five minutes from outside: keep the two lists in step. A failed
# run here emails the user who last touched this file's cron line.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe the public instance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API healthz + registry listing + console
        run: |
          probe() {
            # Two attempts 20s apart: a transient blip must not page anyone.
            for attempt in 1 2; do
              code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "$1") || code=000
              [ "$code" = "200" ] && { echo "ok   $1"; return 0; }
              echo "warn $1 answered $code (attempt $attempt)"
              sleep 20
            done
            echo "FAIL $1"
            return 1
          }
          probe https://api.cachetzec.com/healthz
          # healthz only says the process is up. The listing goes through
          # the node and the database: it is what a visitor's page needs.
          probe "https://api.cachetzec.com/api/v1/assets?limit=1"
          probe https://cachetzec.com
