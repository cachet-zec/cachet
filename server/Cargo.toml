[workspace]
resolver = "2"
# The vendored orchard is a standalone package, not a member of this one.
exclude = ["vendor/orchard"]
members = [
    "crates/domain",
    "crates/notes",
    "crates/swap",
    "crates/chain",
    "crates/index",
    "crates/api",
    "crates/mint-engine",
    "crates/verify-engine",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cachet-zec/cachet"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
cachet-domain = { path = "crates/domain" }
cachet-chain = { path = "crates/chain" }
cachet-index = { path = "crates/index" }

# Database (index crate only; runtime-checked queries for now, see the
# crate's README note)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "macros",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2"
anyhow = "1"

# Async runtime & web
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8"
async-trait = "0.1"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The chain crate is the ONLY place QEDIT forks may be imported (see ADR-001).
# The [patch.crates-io] section below redirects the protocol crates to the
# QED-it forks at exact revs, mirroring zcash_tx_tool @ 655298f (ADR-000).
# Bumping any rev is its own PR: `chore(chain): bump qedit stack to <rev>`.

[workspace.dependencies.orchard]
version = "0.15.5"
features = ["zsa-issuance"]

[workspace.dependencies.zcash_primitives]
version = "0.30.1"
features = ["transparent-inputs", "non-standard-fees", "zsa-issuance", "zip-233"]

[workspace.dependencies.zcash_protocol]
version = "0.10.5"

[workspace.dependencies.zcash_proofs]
version = "0.30.0"

[workspace.dependencies.zcash_encoding]
# Upstream librustzcash 0.30 still consumes zcash_encoding 0.4 from crates.io
# (0.5.0 is a breaking release it has not adopted yet); stay on the same one.
version = "0.4.0"

[workspace.dependencies.zcash_transparent]
version = "0.10.0"
features = ["transparent-inputs"]

[patch.crates-io]
# SPIKE (ADR-005): the transaction-v7 line, QED-it/librustzcash#377 head
# (zcash_primitives 0.30.1, NU6.3 merged, ZSA moved to v7). Its pins below
# (orchard, sapling-crypto, zcash_note_encryption, halo2) are #377's own.
# #377 caches the Orchard proving key per circuit version upstream
# (`cached_orchard_proving_key`), so the librustzcash vendor and its
# CACHET PATCH are gone: back to git pins.
# Vendored QED-it orchard e40bdfad (zsa1, includes QED-it/orchard#291) + the
# signing-parts accessor patch, see vendor/orchard/README.cachet.md.
orchard = { path = "vendor/orchard" }
# QED-it/sapling-crypto#15 head (zcash_note_encryption 0.4.2), still open.
sapling-crypto = { git = "https://github.com/QED-it/sapling-crypto", rev = "e5a27294bad91138156fec29932759d3a6f7c7d5" }
zcash_note_encryption = { git = "https://github.com/zcash/zcash_note_encryption", rev = "40b73b157374b62b648a26b94a1f236e5d9c389f" }
zcash_primitives = { git = "https://github.com/QED-it/librustzcash", rev = "562300d6861a244fab47e48f8f91057a3d2b0af5" }
zcash_protocol = { git = "https://github.com/QED-it/librustzcash", rev = "562300d6861a244fab47e48f8f91057a3d2b0af5" }
zcash_address = { git = "https://github.com/QED-it/librustzcash", rev = "562300d6861a244fab47e48f8f91057a3d2b0af5" }
zcash_proofs = { git = "https://github.com/QED-it/librustzcash", rev = "562300d6861a244fab47e48f8f91057a3d2b0af5" }
zcash_transparent = { git = "https://github.com/QED-it/librustzcash", rev = "562300d6861a244fab47e48f8f91057a3d2b0af5" }
sinsemilla = { git = "https://github.com/zcash/sinsemilla", rev = "aabb707e862bc3d7b803c77d14e5a771bcee3e8c" }
# QED-it/orchard#286 moved the zsa1 line back to upstream zcash/halo2.
halo2_proofs = { git = "https://github.com/zcash/halo2", rev = "828fab66a72116a4a8ea0dc7d8895667d90dacf4" }
halo2_gadgets = { git = "https://github.com/zcash/halo2", rev = "828fab66a72116a4a8ea0dc7d8895667d90dacf4" }
zcash_spec = { git = "https://github.com/QED-it/zcash_spec", rev = "d5e84264d2ad0646b587a837f4e2424ca64d3a05" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Halo2 proving is unusably slow unoptimized; optimize dependencies even in
# dev/test builds while keeping our own crates fast to compile. Cuts the
# regtest integration suite and e2e issuance times by roughly an order of
# magnitude.
[profile.dev.package."*"]
opt-level = 3
