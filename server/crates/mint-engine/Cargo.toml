# The browser mint engine: key derivation, issuance-transaction building,
# Halo2 proving and signing, compiled to WebAssembly so seeds NEVER leave
# the user's browser. The server only relays the signed bytes.
#
# Build for the web with infra/build-mint-engine.sh. Two variants ship:
# the default single-core build (halo2's fallback, works everywhere) and
# a `threads` build (rayon over shared-memory wasm threads, needs a
# cross-origin-isolated page; 4-8x faster proving on consumer CPUs).
# The crate also compiles natively so it stays inside the workspace
# quality gates.
[package]
name = "cachet-mint-engine"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Multicore proving over wasm threads (wasm32 only; the build script sets
# the atomics target features and rebuilds std). `no-bundler` because the
# engine is served as plain ES modules, no JS bundler involved.
threads = ["orchard/multicore", "dep:wasm-bindgen-rayon"]

[dependencies]
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }
cachet-notes = { path = "../notes" }
zcash_address = { version = "0.10.1", default-features = false }
orchard = { version = "0.12.0", default-features = false, features = ["circuit", "std", "zsa-issuance"] }
zcash_primitives = { version = "0.26.1", default-features = false, features = ["std", "circuits", "zsa-issuance", "transparent-inputs", "non-standard-fees", "zip-233"] }
zcash_protocol = { version = "0.7.2" }
zcash_transparent = { version = "0.6.3", default-features = false }
sapling-crypto = { version = "0.6.0", default-features = false }
zip32 = "0.2"
bip0039 = "0.12"
nonempty = { version = "0.11", default-features = false }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
hex = { workspace = true }
jubjub = "0.10"
bls12_381 = "0.8"
