# The browser verification engine: recomputes a ZSA asset id from public
# data alone, so a reader can check that a served description really is the
# one the chain committed to.
#
# Deliberately NOT the mint engine. That crate carries orchard's `circuit`
# feature (the Halo2 proving circuit) and weighs megabytes; nothing here
# proves anything, so the circuit is left out and the module stays small
# enough to load on an asset page.
#
# Build for the web with infra/build-verify-engine.sh. Compiles natively
# too, so it stays inside the workspace quality gates.
[package]
name = "cachet-verify-engine"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `circuit`: verification needs the asset-id derivation, never a proof.
orchard = { version = "0.14.0", default-features = false, features = ["std", "zsa-issuance"] }
nonempty = { version = "0.11", default-features = false }
wasm-bindgen = "0.2"
hex = { workspace = true }
